<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bowl Customization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Main Dish Area -->
        <div class="main-dish-area">
            <img src="assets/main_bowl.png" alt="Main Bowl" class="main-bowl" id="mainBowl">
            <!-- Animation layer for ingredients flying into the bowl -->
            <div id="animation-layer"></div>
        </div>

        <!-- Bottom Sheet -->
        <div class="bottom-sheet">
            <div class="sheet-content">
                <!-- Large Card & Small Cards Grid -->
                <div class="ingredients-grid">
                    <!-- Large Veggies Card -->
                    <div class="card card-large" id="card-veggies">
                        <div class="card-header">
                            <span class="heart-icon">❤️</span>
                        </div>
                        <img src="assets/assorted_veggies.png" alt="Vegetables" class="large-img">
                        <div class="card-footer">
                            <div class="text-group">
                                <h3>Vegetables</h3>
                                <p>Select at least 1</p>
                            </div>
                            <button class="add-btn circle-btn" aria-label="Add Vegetables">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Small Cards Grid -->
                    <div class="small-cards-wrapper">
                        <div class="card card-small ingredient-card" data-ingredient="onions" data-emoji="🧅">
                            <div class="img-placeholder">🧅</div>
                            <p>Onions</p>
                        </div>
                        <div class="card card-small ingredient-card" data-ingredient="olives" data-emoji="🫒">
                            <div class="img-placeholder">🫒</div>
                            <p>Olives</p>
                        </div>
                        <div class="card card-small ingredient-card" data-ingredient="pickle" data-emoji="🥒">
                            <div class="img-placeholder">🥒</div>
                            <p>Pickle</p>
                        </div>
                        <div class="card card-small ingredient-card" data-ingredient="jalapenos" data-emoji="🌶️">
                            <div class="img-placeholder">🌶️</div>
                            <p>Jalapenos</p>
                        </div>
                        <div class="card card-small ingredient-card" data-ingredient="capsicum" data-emoji="🫑">
                            <div class="img-placeholder">🫑</div>
                            <p>Capsicum</p>
                        </div>
                        <div class="card card-small ingredient-card" data-ingredient="sauce" data-emoji="🥣">
                            <div class="img-placeholder">🥣</div>
                            <p>Sauce</p>
                        </div>
                    </div>
                </div>

                <!-- Aloo Patty Card -->
                <div class="card card-row aloo-patty">
                    <div class="row-left">
                        <img src="assets/aloo_patty.png" alt="Aloo Patty" class="row-img">
                        <div class="row-text">
                            <h4>Aloo Patty</h4>
                            <p>+₹60</p>
                        </div>
                    </div>
                    <div class="row-right">
                        <div class="counter" id="patty-counter">
                            <button class="counter-btn minus">−</button>
                            <span class="count">1</span>
                            <button class="counter-btn plus">+</button>
                        </div>
                        <button class="delete-btn circle-btn light-btn">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Southwest Chipotle Card -->
                <div class="card card-row sauce-card active">
                    <div class="row-left">
                        <div class="img-placeholder round">🥣</div>
                        <div class="row-text">
                            <h4>Southwest Chipotle</h4>
                            <p>1 option chosen</p>
                        </div>
                    </div>
                    <div class="row-right">
                        <div class="chosen-status">
                            <span>Chosen</span>
                            <div class="check-circle">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
