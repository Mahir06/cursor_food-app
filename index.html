<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rotary dialer</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="stage">
      <section class="copy" aria-label="Introduction">
        <h1 class="title">Enter your number</h1>
        <p class="tagline">the old way</p>
        <p class="hint" aria-hidden="true">⌫</p>
        <p class="instruction">
          Rotate until digit reaches marker, then release to enter
        </p>
      </section>

      <div class="phone-wrap">
        <img
          class="phone-mockup"
          src="assets/apple-iphone-16-pro-max-2024-medium.png"
          width="364"
          height="750"
          alt="iPhone mockup with blank screen"
          decoding="async"
        />
      </div>
    </main>
  </body>
</html>
