<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bowl Customization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page" id="main-container">
        <!-- Phone Mockup Image -->
        <div class="device-wrapper">
            <img src="assets/iphone.png" 
                 alt="iPhone Mockup" 
                 class="device--photo">
            
            <!-- App UI Screen perfectly mapped inside phone screen -->
            <div class="app-screen">
                <!-- Header -->
                <div class="header">
                    <button class="icon-btn back-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                    </button>
                    <div class="header-titles">
                        <h1>Aloo Patty Rice Bowl</h1>
                        <p>Subway • 12 Mins</p>
                    </div>
                    <button class="icon-btn cart-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
                    </button>
                </div>

                <!-- Main Bowl Area (Drop Target) -->
                <div class="bowl-area" id="drop-zone">
                    <img src="assets/RICE BOWL.png" alt="Rice Bowl" class="main-bowl-img" id="mainBowlImage">
                    <button class="undo-btn" id="undoBtn">Undo</button>
                </div>

                <!-- Ingredients Grid -->
                <div class="ingredients-container">
                    <div class="ingredients-grid">
                        
                        <!-- Onions: Large Square (Spans 2x2) -->
                        <div class="ingredient-card card-large-sq">
                            <img src="assets/INGREDIENT _ ONION.png" alt="Onions" draggable="true" data-ingredient="ONION">
                            <p>Onions</p>
                        </div>
                        
                        <!-- Jalapenos: Horizontal (Spans 2x1) -->
                        <div class="ingredient-card card-horiz">
                            <p>Jalapenos</p>
                            <img src="assets/INGREDIENT _ JALAPENO.png" alt="Jalapenos" draggable="true" data-ingredient="JALAPENO">
                        </div>
                        
                        <!-- Olives: Horizontal (Spans 2x1) -->
                        <div class="ingredient-card card-horiz">
                            <p>Olives</p>
                            <img src="assets/INGREDIENT _ OLIVE.png" alt="Olives" draggable="true" data-ingredient="OLIVE">
                        </div>
                        
                        <!-- Capsicum: Horizontal (Spans 2x1) -->
                        <div class="ingredient-card card-horiz">
                            <p>Capsicum</p>
                            <img src="assets/INGREDIENT _ CAPSICUM.png" alt="Capsicum" draggable="true" data-ingredient="CAPSICUM">
                        </div>
                        
                        <!-- Aloo Patty: Large Square (Spans 2x2) -->
                        <div class="ingredient-card card-large-sq patty-card">
                            <img src="assets/INGREDIENT _ ALOO PATTY.png" alt="Aloo Patty" draggable="true" data-ingredient="ALOO PATTY">
                            <p>Aloo Patty</p>
                        </div>
                        
                        <!-- Chipotle: Small Square (Spans 1x1) -->
                        <div class="ingredient-card card-small-sq">
                            <img src="assets/INGREDIENT _ CHIPOTLE SAUCE.png" alt="Chipotle" draggable="true" data-ingredient="CHIPOTLE SAUCE">
                            <p>Chipotle</p>
                        </div>
                        
                        <!-- Biryani: Small Square (Spans 1x1) -->
                        <div class="ingredient-card card-small-sq">
                            <img src="assets/INGREDIENT _ BIRYANI SAUCE.png" alt="Biryani" draggable="true" data-ingredient="BIRYANI SAUCE">
                            <p>Biryani</p>
                        </div>

                    </div>
                </div>

                <!-- Bottom Bar -->
                <div class="bottom-bar">
                    <div class="quantity-selector">
                        <button class="qty-btn">−</button>
                        <span>1</span>
                        <button class="qty-btn">+</button>
                    </div>
                    <button class="add-to-cart-btn">Add to Cart</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
